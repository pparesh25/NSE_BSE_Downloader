name: Trusted Release Candidate

"on":
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      target:
        description: Trusted platform candidate to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows

permissions:
  contents: read

concurrency:
  group: trusted-release-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  macos:
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    name: macOS ARM64 signed and notarized
    runs-on: macos-15
    timeout-minutes: 120
    environment: release-signing
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: ${{ inputs.source_commit }}

    steps:
      - name: Validate immutable source commit
        shell: bash
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_commit must be a full 40-character Git SHA" >&2
            exit 1
          fi

      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime-only release dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r requirements.txt
          -r requirements-build.txt

      - name: Validate signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          required=(
            APPLE_CERTIFICATE_BASE64
            APPLE_CERTIFICATE_PASSWORD
            APPLE_KEYCHAIN_PASSWORD
            APPLE_NOTARY_KEY_BASE64
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_ISSUER_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release-signing secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          CERTIFICATE_PATH="$certificate_path" python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE_BASE64"], validate=True)
          )
          PY
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build Developer ID signed application
        run: >-
          python build_nuitka_cross_platform.py
          --target-platform=darwin
          --macos-sign-identity=auto
          --macos-sign-notarization
          --build
          --clean
          --output-dir=build-output

      - name: Verify Developer ID signature
        shell: bash
        run: |
          app_path=$(python -c 'from pathlib import Path; from package_release_artifact import find_build_output; print(find_build_output(Path("build-output"), "darwin"))')
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path"
          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Notarize, staple, and assess with Gatekeeper
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey.p8"
          API_KEY_PATH="$api_key_path" python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["API_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_NOTARY_KEY_BASE64"], validate=True)
          )
          PY
          chmod 600 "$api_key_path"
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notary-upload.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notary-upload.zip" \
            --key "$api_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > notary-response.json
          python -c 'import json; data=json.load(open("notary-response.json", encoding="utf-8")); assert data.get("status") == "Accepted", data'
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Package notarized release candidate
        run: >-
          python package_release_artifact.py
          --target-platform=darwin
          --architecture=arm64
          --trust-status=notarized
          --build-dir=build-output
          --output-dir=release-output

      - name: Upload notarized candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64-trusted-release-candidate
          path: |
            release-output/*.zip
            release-output/*.sha256
            build-output/nuitka-compilation-report.xml
            notary-response.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral Apple credentials
        if: always()
        shell: bash
        env:
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

  windows:
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    name: Windows x64 Authenticode signed
    runs-on: windows-2022
    timeout-minutes: 120
    environment: release-signing
    env:
      PYTHONUNBUFFERED: "1"
      SOURCE_COMMIT: ${{ inputs.source_commit }}

    steps:
      - name: Validate immutable source commit
        shell: pwsh
        run: |
          if ($env:SOURCE_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'source_commit must be a full 40-character Git SHA'
          }

      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime-only release dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          -r requirements.txt
          -r requirements-build.txt

      - name: Validate signing credentials
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          foreach ($name in @(
            'WINDOWS_CERTIFICATE_BASE64',
            'WINDOWS_CERTIFICATE_PASSWORD',
            'WINDOWS_TIMESTAMP_URL'
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Missing release-signing secret or variable: $name"
            }
          }

      - name: Decode Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\code-signing.pfx", $bytes)

      - name: Build Windows application
        run: >-
          python build_nuitka_cross_platform.py
          --target-platform=windows
          --build
          --clean
          --output-dir=build-output

      - name: Sign and verify Windows executable
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $signTool) { throw 'SignTool was not found in the Windows SDK' }
          $executable = 'build-output\NSE_BSE_Downloader.exe'
          $signArguments = @(
            'sign',
            '/fd', 'SHA256',
            '/td', 'SHA256',
            '/tr', $env:WINDOWS_TIMESTAMP_URL,
            '/f', "$env:RUNNER_TEMP\code-signing.pfx",
            '/p', $env:WINDOWS_CERTIFICATE_PASSWORD,
            $executable
          )
          & $signTool.FullName @signArguments
          if ($LASTEXITCODE -ne 0) { throw "SignTool sign failed: $LASTEXITCODE" }
          & $signTool.FullName verify /pa /all /v $executable
          if ($LASTEXITCODE -ne 0) { throw "SignTool verify failed: $LASTEXITCODE" }

      - name: Package signed release candidate
        run: >-
          python package_release_artifact.py
          --target-platform=windows
          --architecture=x64
          --trust-status=signed
          --build-dir=build-output
          --output-dir=release-output

      - name: Upload signed candidate and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-trusted-release-candidate
          path: |
            release-output/*.zip
            release-output/*.sha256
            build-output/nuitka-compilation-report.xml
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral Windows certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\code-signing.pfx" -Force -ErrorAction SilentlyContinue
