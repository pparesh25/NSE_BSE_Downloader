# NSE/BSE Data Downloader Configuration

app_settings:
  release_date: "2026-08-04"
  features:
    - "Date-aware legacy/current NSE and BSE downloads"
    - "Delivery volume and percentage for NSE/BSE cash data"
    - "Open interest and change in OI for NSE futures"
    - "Corporate-action-adjusted symbol-wise text histories"
    - "Strict source validation and resumable per-date repair"
    - "Deterministic restart-safe EQ, SME and Index reconciliation"
    - "Custom calendar ranges and collapsible GUI sections"
    - "Official NSE holiday refresh with IST-aware trading dates"
    - "Cooperative cancellation and typed GUI outcomes"
    - "Nuitka-safe bundled resources and stable packaged-app identity"
    - "Responsive default GUI layout and source-mode process identity"
    - "Python 3.10/3.13 CI gates with enforced test coverage"
    - "Automatic update notifications"

# Data storage paths
data_paths:
  base_folder: "~/NSE_BSE_Data"  # Will be expanded to user home directory
  exchanges:
    NSE:
      EQ: "NSE/EQ"
      FO: "NSE/FO"
      SME: "NSE/SME"
      INDEX: "NSE/INDEX"
    BSE:
      EQ: "BSE/EQ"
      INDEX: "BSE/INDEX"

# Download settings
download_settings:
  max_concurrent_downloads: 1  # Sequential downloads for stability
  retry_attempts: 3  # Consistent retry attempts for all servers
  timeout_seconds: 5  # Wait for server response (user configurable)
  # Split budgets.  Without these three keys the value above becomes an aiohttp
  # *total* timeout covering the connect plus every body read, which a
  # multi-megabyte UDiFF ZIP cannot finish in 5 seconds.  Keeping them separate
  # lets `timeout_seconds` stay the responsiveness dial while a slow but healthy
  # transfer still runs to completion.
  connect_timeout_seconds: 10   # TCP and TLS handshake only
  read_timeout_seconds: 60      # allowed gap between two body chunks
  attempt_timeout_seconds: 300  # one whole attempt, including a large download
  chunk_size: 8192
  rate_limit_delay: 0.5  # Consistent delay between requests for all servers
  # Phase 7 bounded stage defaults; date selection/scheduling is unchanged.
  prepare_workers: 2
  persistence_workers: 1
  stage_queue_size: 2
  prepared_cache_dates: 4
  # How many date/segment entries one symbol-history batch may hold.  A batch
  # loads all of its entries at once and rewrites each touched symbol file
  # once, so this trades peak memory against write volume: lower is smaller
  # and slower, higher is faster and larger.  A multi-year backfill needs this
  # bounded -- publishing every collected date in one batch is what used to
  # exhaust memory at the very end of a long run.
  history_batch_dates: 50

# Download options for data processing
download_options:
  # Extended canonical market data
  include_delivery_data: true
  include_fo_open_interest: true
  generate_symbol_files: true
  apply_corporate_actions: true

  # Phase 5 step 1: write every published frame into .state/eod.sqlite3 as
  # well as to the text files.  Nothing reads that database yet -- the text
  # files remain the system of record -- so this can be turned off at any
  # time and the only loss is the mirror.
  dual_write_eod_database: true

  # Phase 5 step 3: write symbol histories out of .state/eod.sqlite3, extending
  # each one in place instead of rewriting it.  Measured on a one-day change:
  # 27.72s and 3,625 KB become 10.66s and 700 KB, byte-identical output.  Off
  # by default -- it changes which code writes the published files.
  publish_histories_from_database: false

  # SME Symbol Processing
  sme_add_suffix: true  # Add '_SME' suffix to NSE SME symbol names

  # Deterministic combined-file options
  sme_append_to_eq: true      # Append NSE SME data to NSE EQ files
  index_append_to_eq: true    # Append NSE Index data to NSE EQ files
  bse_index_append_to_eq: true # Append BSE Index data to BSE EQ files

# Retention for the diagnostic copies under `<data folder>/.state`.  These
# trees are kept so a human can inspect what went wrong after a failed run;
# nothing in the application reads them back, and they grow without limit
# during a multi-year backfill.  `.state/raw` -- the checksummed snapshots the
# `--rebuild-*` commands read -- is never pruned.  A negative value disables
# the rule it belongs to.
state_retention:
  quarantine_days: 30            # per category, e.g. source_reports, history
  quarantine_max_files: 100      # newest kept per category
  raw_revision_days: 90          # superseded raw snapshots
  raw_revision_max_per_date: 5   # newest kept per exchange/segment/date
  # `.state/backups/history` held a copy of every symbol file, written before
  # every write and read by nothing.  v1.1.0 stopped writing it; 0 clears out
  # what an earlier version left behind.  Raise it to keep that tree instead.
  legacy_backup_days: 0

# Date settings
date_settings:
  base_start_date: "2025-07-15"  # Default start date for first run
  weekend_skip: true  # Skip weekends automatically (can be overridden by user)
  holiday_skip: true  # Skip known holidays
  allow_weekend_override: true  # Allow user to download weekend data

# GUI settings
gui_settings:
  window_title: "NSE BSE Data Downloader"
  window_width: 720
  window_height: 960
  default_exchanges:
    - "NSE_EQ"
  progress_update_interval: 100  # milliseconds

# Exchange URLs and patterns
exchange_config:
  NSE:
    EQ:
      base_url: "https://archives.nseindia.com/content/cm"
      filename_pattern: "BhavCopy_NSE_CM_0_0_0_{date}_F_0000.csv.zip"
      date_format: "%Y%m%d"
      file_suffix: "-NSE-EQ"
    FO:
      base_url: "https://archives.nseindia.com/content/fo"
      filename_pattern: "BhavCopy_NSE_FO_0_0_0_{date}_F_0000.csv.zip"
      date_format: "%Y%m%d"
      file_suffix: "-NSE-FO"
    SME:
      base_url: "https://archives.nseindia.com/archives/sme/bhavcopy"
      filename_pattern: "sme{date}.csv"
      date_format: "%d%m%y"
      file_suffix: "-NSE-SME"
    INDEX:
      base_url: "https://archives.nseindia.com/content/indices"
      filename_pattern: "ind_close_all_{date}.csv"
      date_format: "%d%m%Y"
      file_suffix: "-NSE-INDEX"
  BSE:
    EQ:
      base_url: "https://www.bseindia.com/download/BhavCopy/Equity"
      filename_pattern: "BhavCopy_BSE_CM_0_0_0_{date}_F_0000.CSV"
      date_format: "%Y%m%d"
      file_suffix: "-BSE-EQ"
    INDEX:
      base_url: "https://www.bseindia.com/bsedata/Index_Bhavcopy"
      filename_pattern: "INDEXSummary_{date}.csv"
      date_format: "%d%m%Y"
      file_suffix: "-BSE-INDEX"

# Logging settings
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "downloader.log"
