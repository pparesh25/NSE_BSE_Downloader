name: Quality Gates

# Pull requests are the gate for every change.  Pushes are additionally checked only on
# long-lived branches, so a pull request does not run the whole suite twice for one
# commit and pushes to pre-port archive branches never schedule work.
"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt runtime dependency
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite with coverage gate
        run: >-
          python -m pytest
          --cov=src
          --cov=main
          --cov=runtime_paths
          --cov=runtime_identity
          --cov=app_metadata
          --cov=version
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-fail-under=70

  static-analysis:
    name: Ruff, mypy and packaging dry run
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt runtime dependency
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and development dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy
        run: >-
          python -m mypy
          src
          main.py
          app_metadata.py
          runtime_paths.py
          runtime_identity.py
          build_nuitka_cross_platform.py
          package_release_artifact.py

      # Compiled artifacts are built only for a release tag, so this dry run is
      # what keeps packaging configuration errors from reaching that point.  It
      # covers every shipped target and starts no build.
      - name: Validate Nuitka commands for every target without building
        run: |
          for target in linux windows darwin; do
            echo "--- $target ---"
            python build_nuitka_cross_platform.py --target "$target"
          done
